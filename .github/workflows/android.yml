# Builds Mockfy.apk (the native Android app in mobile/) on every version tag and attaches it to the release.
name: Build Android app

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android project
        run: |
          flutter create --platforms=android --org uz.mockfy --project-name mockfy .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then echo "$KEYSTORE" | base64 -d > android/app/upload.jks; echo "signing with the Mockfy key"; else echo "::warning::No ANDROID_KEYSTORE_B64 secret: debug signing, updates will not install over older builds"; fi
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || {
            grep -E "^\s*error" analyze.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - name: Build APK
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_ARGS: ${{ startsWith(github.ref, 'refs/tags/v') && format('--build-name={0} --build-number={1}', github.ref_name, github.run_number) || '' }}
        run: |
          VERSION_ARGS="${VERSION_ARGS/--build-name=v/--build-name=}"
          set -o pipefail
          flutter build apk --release $VERSION_ARGS 2>&1 | tee build.log || {
            grep -iE "error|exception|failed|what went wrong|unsupported|requires" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - run: cp build/app/outputs/flutter-apk/app-release.apk Mockfy.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mockfy.apk
          path: mobile/Mockfy.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: mobile/Mockfy.apk
