# Builds the installers on every version tag (v1.0.3, ...) and attaches them to that GitHub release.
# The version comes from the tag. latest.yml + the blockmap let installed Windows apps update themselves.
name: Build desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: |
              dist/Mockfy-Setup.exe
              dist/Mockfy-Setup.exe.blockmap
              dist/latest.yml
          - os: macos-latest
            script: dist:mac
            files: |
              dist/Mockfy.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.files }}
