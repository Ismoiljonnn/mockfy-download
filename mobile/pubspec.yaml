name: mockfy
description: Mockfy IELTS practice for Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  path_provider: ^2.1.4
  app_links: ^6.3.2
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2
  open_filex: ^4.5.0
  just_audio: ^0.9.42
  shared_preferences: ^2.3.3
  webview_flutter: ^4.10.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  workmanager: '>=0.6.0'
  record: ^6.0.0
  flutter_svg: ^2.0.16
  flutter_tts: ^4.2.0
  share_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/hudi.png
    - assets/hudi/
    - assets/sfx/
    - assets/i18n/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#1A1A1A"
  adaptive_icon_foreground: assets/icon.png

# Opening the app: Hudi's head on the app's own background straight away (like Telegram), then the
# app's own short intro carries on from it.
flutter_native_splash:
  color: "#FAF9F5"
  color_dark: "#1A1A1A"
  image: assets/splash.png
  image_dark: assets/splash.png
  android_12:
    image: assets/splash12.png
    image_dark: assets/splash12.png
    color: "#FAF9F5"
    color_dark: "#1A1A1A"
  ios: false
  web: false
