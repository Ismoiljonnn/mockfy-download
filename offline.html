<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
<title>Mockfy</title>
<style>
  :root { color-scheme: light dark; --bg: #FAF9F5; --ink: #141413; --ink2: #5E5D59; --btn: #141413; --btnfg: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1A1A1A; --ink: #ECECEC; --ink2: #A6A6A6; --btn: #ECECEC; --btnfg: #1A1A1A; } }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 24px; margin: 14px 0 6px; }
  p { color: var(--ink2); margin: 0 0 20px; }
  button { height: 44px; padding: 0 22px; border: 0; border-radius: 8px; background: var(--btn); color: var(--btnfg); font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <div>
    <img src="build/icon.png" alt="">
    <h1>No connection</h1>
    <p>Mockfy needs the internet. Check your connection and try again.</p>
    <button id="retry">Try again</button>
  </div>
  <script>
    const to = new URLSearchParams(location.search).get('to') || 'https://mockfy.uz/dashboard';
    const go = () => { if (/^https?:\/\//.test(to)) location.href = to; };
    document.getElementById('retry').onclick = go;
    addEventListener('online', go);
  </script>
</body>
</html>
