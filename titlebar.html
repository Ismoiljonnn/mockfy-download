<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
<title>Mockfy</title>
<style>
  :root { --bg: #FAF9F5; --ink: #141413; --ink2: #8F8D85; --hover: rgba(0, 0, 0, .06); }
  :root.dark { --ink: #ECECEC; --ink2: #8A8A8A; --hover: rgba(255, 255, 255, .08); }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { font: 13px/1 'Segoe UI', system-ui, -apple-system, sans-serif; color: var(--ink); user-select: none; }
  .bar { height: 38px; display: flex; align-items: center; gap: 2px; padding: 0 8px; -webkit-app-region: drag; }
  .mac .bar { padding-left: 80px; }
  button { -webkit-app-region: no-drag; width: 30px; height: 28px; border: 0; border-radius: 7px; background: none; color: var(--ink2);
    display: grid; place-items: center; cursor: default; transition: background .12s, color .12s; }
  button:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
  button:disabled { opacity: .35; }
  svg { width: 16px; height: 16px; }
  .brand { display: flex; align-items: center; gap: 8px; margin-left: 6px; font-weight: 600; letter-spacing: -.01em; }
  .brand img { width: 18px; height: 18px; border-radius: 5px; }
</style>
</head>
<body>
  <div class="bar" id="bar">
    <button id="back" title="Back (Alt+Left)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button id="reload" title="Reload (F5)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg></button>
    <div class="brand"><img src="build/icon.png" alt="">Mockfy</div>
  </div>
  <script>
    if (new URLSearchParams(location.search).get('mac')) document.documentElement.classList.add('mac');
    const b = window.mfBar;
    document.getElementById('back').onclick = () => b.act('back');
    document.getElementById('reload').onclick = () => b.act('reload');
    document.getElementById('bar').addEventListener('dblclick', (e) => { if (!e.target.closest('button')) b.act('max'); });
    b.onLook((l) => {
      document.documentElement.style.setProperty('--bg', l.bg);
      document.documentElement.classList.toggle('dark', !!l.dark);
      document.getElementById('back').disabled = !l.canBack;
    });
  </script>
</body>
</html>
